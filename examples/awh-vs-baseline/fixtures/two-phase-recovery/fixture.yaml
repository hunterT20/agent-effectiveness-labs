schemaVersion: 1
id: two-phase-recovery
name: Add then recover journal voiding
category: two-phase-recovery
outcomeMode: repository

phases:
  - id: initial
    promptFile: ./prompts/initial.md
    session: new
  - id: recovery
    promptFile: ./prompts/recovery.md
    session: resume

limits:
  timeoutMsPerPhase: 30000
  maxChangedFiles: 2

candidate:
  allowedPaths:
    - src/journal.mjs
  forbiddenPaths:
    - grader/**


grading:
  deterministic:
    - id: hidden-check
      command: node
      args: [./grader/check.mjs]
      required: true
  blindedRubric:
    enabled: false
    rubricFile: null
    minimumRaters: 0
    minimumAgreement: null
  llmJudge:
    role: disabled

reference:
  solutionPatch: ./reference/solution.patch
  mutationCases:
    - ./reference/wrong.patch
