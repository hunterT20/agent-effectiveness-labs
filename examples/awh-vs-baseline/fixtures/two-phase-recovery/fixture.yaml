schemaVersion: 1
id: two-phase-recovery
name: two-phase-recovery
category: two-phase-recovery
outcomeMode: repository

phases:
  - id: initial
    promptFile: ./prompts/initial.md
    session: new
  - id: recovery
    promptFile: ./prompts/recovery.md
    session: resume

limits:
  timeoutMsPerPhase: 30000
  maxChangedFiles: 12

candidate:
  allowedPaths:
    - src/**
    - .ael/**
  forbiddenPaths:
    - grader/**
    - forbidden/**

grading:
  deterministic:
    - id: hidden-check
      command: node
      args: [./grader/check.mjs]
      required: true
  blindedRubric:
    enabled: false
    rubricFile: null
    minimumRaters: 0
    minimumAgreement: null
  llmJudge:
    role: disabled

reference:
  solutionPatch: ./reference/solution.patch
  mutationCases:
    - ./reference/wrong.patch
