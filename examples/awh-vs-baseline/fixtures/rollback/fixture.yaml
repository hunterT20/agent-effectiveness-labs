schemaVersion: 1
id: rollback
name: Roll back monthlyRate contract
category: rollback
outcomeMode: repository

phases:
  - id: initial
    promptFile: ./prompts/initial.md
    session: new

limits:
  timeoutMsPerPhase: 30000
  maxChangedFiles: 3

candidate:
  allowedPaths:
    - src/interest.mjs
    - docs/CHANGELOG.md
  forbiddenPaths:
    - grader/**


grading:
  deterministic:
    - id: hidden-check
      command: node
      args: [./grader/check.mjs]
      required: true
  blindedRubric:
    enabled: false
    rubricFile: null
    minimumRaters: 0
    minimumAgreement: null
  llmJudge:
    role: disabled

reference:
  solutionPatch: ./reference/solution.patch
  mutationCases:
    - ./reference/wrong.patch
