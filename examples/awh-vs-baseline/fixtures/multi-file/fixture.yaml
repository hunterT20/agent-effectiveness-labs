schemaVersion: 1
id: multi-file
name: Add ledger categories across modules
category: multi-file
outcomeMode: repository

phases:
  - id: initial
    promptFile: ./prompts/initial.md
    session: new

limits:
  timeoutMsPerPhase: 30000
  maxChangedFiles: 4

candidate:
  allowedPaths:
    - src/ledger.mjs
    - src/report.mjs
  forbiddenPaths:
    - grader/**


grading:
  deterministic:
    - id: hidden-check
      command: node
      args: [./grader/check.mjs]
      required: true
  blindedRubric:
    enabled: false
    rubricFile: null
    minimumRaters: 0
    minimumAgreement: null
  llmJudge:
    role: disabled

reference:
  solutionPatch: ./reference/solution.patch
  mutationCases:
    - ./reference/wrong.patch
