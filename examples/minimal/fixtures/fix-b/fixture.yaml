schemaVersion: 1
id: fix-b
name: Fix B
category: basic
outcomeMode: repository

phases:
  - id: initial
    promptFile: ./prompts/initial.md
    session: new

limits:
  timeoutMsPerPhase: 30000
  maxChangedFiles: 5

candidate:
  allowedPaths:
    - src/**
  forbiddenPaths:
    - grader/**

grading:
  deterministic:
    - id: answer-check
      command: node
      args: [./grader/check.mjs]
      required: true
  blindedRubric:
    enabled: false
    rubricFile: null
    minimumRaters: 0
    minimumAgreement: null
  llmJudge:
    role: disabled

reference:
  solutionPatch: ./reference/solution.patch
