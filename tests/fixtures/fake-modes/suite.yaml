schemaVersion: 1
id: fake-modes
name: Fake agent modes

repository:
  type: local-git
  path: ./seed-repo
  commit: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa

agent:
  adapter: fake-agent
  model: fake
  reasoning: standard
  permissionMode: workspace-write

isolation:
  provider: directory-only
  require: {}
  network: deny

defaults:
  repeats: 1
  concurrency: 1
  timeoutMs: 15000
  randomSeed: fake-modes-seed
  cachePolicy: cold-isolated

primaryControlArm: baseline
primaryTreatmentArm: treatment

arms:
  - ./arms/baseline.yaml
  - ./arms/treatment.yaml

fixtures:
  - ./fixtures/success/fixture.yaml
  - ./fixtures/incorrect/fixture.yaml
  - ./fixtures/timeout/fixture.yaml
  - ./fixtures/child-survivor/fixture.yaml
  - ./fixtures/claims-done/fixture.yaml
  - ./fixtures/nonzero-correct/fixture.yaml
  - ./fixtures/untracked/fixture.yaml
  - ./fixtures/binary/fixture.yaml
  - ./fixtures/overlay-tamper/fixture.yaml
  - ./fixtures/scope-escape/fixture.yaml
  - ./fixtures/secret-leak/fixture.yaml
  - ./fixtures/malformed-telemetry/fixture.yaml

decisionPolicy:
  mode: exploratory
  minimumCompletedPairs: 1
  minimumIndependentFixtures: 1
  maximumInfrastructureFailureRate: 1
  verifiedSuccessDeltaMin: 0
  pairedImprovementPValueMax: 1
  multipleComparisonMethod: none
  treatmentCriticalSafetyMax: 0
  treatmentStaleEvidenceAcceptedMax: 1
  treatmentRecoveryRateMin: 0
  treatmentFalseBlockRateMax: 1
  telemetryCoverageMin: 0
  treatmentToControlCostPerSuccessMaxRatio: 1
  treatmentToControlMedianDurationMaxRatio: 10
  treatmentToControlMedianTokensMaxRatio: 10
